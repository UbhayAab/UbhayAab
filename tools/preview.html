<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>asset preview</title>
<style>
  body{margin:0;font:13px/1.5 ui-monospace,Consolas,monospace;background:#0d1117;color:#c9d1d9}
  .row{display:flex;flex-direction:column;gap:0}
  .pane{padding:28px 34px}
  .pane.light{background:#ffffff;color:#1f2328}
  .pane.dark{background:#0d1117;color:#c9d1d9}
  h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.5;margin:0 0 14px;font-weight:600}
  img{display:block;max-width:920px;width:100%}
  .stack{display:flex;flex-direction:column;gap:22px}
</style>
</head>
<body>
<!-- Renders every generated asset against BOTH GitHub page backgrounds.
     The point is to prove a theme mismatch degrades instead of breaking:
     Firefox always resolves the light branch inside an <img>-loaded SVG. -->
<div class="row">
  <div class="pane dark">
    <h2>dark page &middot; dark asset (chrome/safari, dark OS)</h2>
    <div class="stack" id="dd"></div>
  </div>
  <div class="pane dark">
    <h2>dark page &middot; light asset (firefox always lands here)</h2>
    <div class="stack" id="dl"></div>
  </div>
  <div class="pane light">
    <h2>light page &middot; light asset</h2>
    <div class="stack" id="ll"></div>
  </div>
</div>
<script>
  const assets = new URLSearchParams(location.search).get('a');
  const names = assets ? assets.split(',') : ['hero'];
  const slot = (id, theme) => {
    const el = document.getElementById(id);
    for (const nm of names) {
      const img = document.createElement('img');
      img.src = `../assets/${nm}-${theme}.svg?t=${Date.now()}`;
      img.alt = nm;
      el.appendChild(img);
    }
  };
  slot('dd', 'dark'); slot('dl', 'light'); slot('ll', 'light');
</script>
</body>
</html>
